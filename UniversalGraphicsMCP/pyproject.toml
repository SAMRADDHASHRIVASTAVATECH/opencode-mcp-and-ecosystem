[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="universal-visual-mcp"
version="1.0.0"
description="Composable, capability-discovered visual computing MCP"
requires-python=">=3.11"
dependencies=["mcp>=1.2,<2", "Pillow>=10,<13", "numpy>=1.26,<3"]
[project.optional-dependencies]
vision=["opencv-python-headless>=4.9,<5"]
system=["psutil>=5.9,<8"]
dev=["pytest>=8,<9"]
[project.scripts]
universal-visual-mcp="universal_visual.server:main"
[tool.hatch.build.targets.wheel]
packages=["src/universal_visual"]
