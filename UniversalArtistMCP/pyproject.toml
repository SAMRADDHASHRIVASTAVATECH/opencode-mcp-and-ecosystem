[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="universal-artist-mcp"
version="1.0.0"
description="Stateful professional artwork orchestration MCP"
requires-python=">=3.11"
dependencies=["mcp>=1.2,<2", "Pillow>=10,<13", "numpy>=1.26,<3"]
[project.optional-dependencies]
dev=["pytest>=8,<9"]
[project.scripts]
universal-artist-mcp="universal_artist.server:main"
[tool.hatch.build.targets.wheel]
packages=["src/universal_artist"]
