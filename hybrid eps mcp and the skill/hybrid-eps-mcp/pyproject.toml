[build-system]
requires=["setuptools>=75"]
build-backend="setuptools.build_meta"
[project]
name="hybrid-eps-mcp"
version="1.0.0"
description="Secure image edge analysis, vectorization, and hybrid EPS/SVG/PDF export MCP"
requires-python=">=3.11"
dependencies=["mcp>=1.28,<2","numpy>=2","opencv-python-headless>=4.10","Pillow>=11","matplotlib>=3.9","pydantic>=2.10"]
[project.scripts]
hybrid-eps-mcp="hybrid_eps.server:main"
[tool.setuptools.packages.find]
where=["src"]
