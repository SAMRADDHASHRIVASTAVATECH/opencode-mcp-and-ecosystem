[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-operator-mcp"
version = "1.0.0"
description = "One unified MCP server: an autonomous communications & productivity operator around OpenClaw (Google Workspace + Discord + Voice + Meet + OpenClaw) for OpenCode."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "pydantic>=2",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.1",
    "discord.py>=2.3",
    "httpx>=0.24",
    "websockets>=12",
    "requests>=2.31",
]

[project.scripts]
unified-operator-mcp = "unified.main:main"

[tool.setuptools.packages.find]
where = ["src"]
