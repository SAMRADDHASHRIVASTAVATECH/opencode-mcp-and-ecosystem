<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Desktop Person</title><style>
:root{font-family:Inter,Segoe UI,sans-serif;color:#edf1ff;background:#090d19}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 25%,#25336a,#090d19 55%)}.card{width:min(640px,92vw);padding:28px;border:1px solid #6477d6;border-radius:28px;background:#11172bdd;box-shadow:0 24px 80px #0008}.avatar{width:180px;height:180px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from 0deg,#8f75ff,#4ee0c3,#8f75ff);animation:float 4s ease-in-out infinite}.face{width:160px;height:160px;border-radius:50%;background:#171e38;position:relative}.eye{position:absolute;top:62px;width:18px;height:24px;background:#bfffee;border-radius:50%}.eye.l{left:43px}.eye.r{right:43px}.mouth{position:absolute;width:46px;height:18px;border-bottom:5px solid #bfffee;border-radius:50%;left:57px;top:105px}.mode{text-align:center;font-size:26px;font-weight:750;margin:20px 0 4px}.activity{text-align:center;color:#9eacd0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.box{background:#0c1122;padding:12px;border-radius:14px}.label{font-size:11px;color:#7f90bb;text-transform:uppercase}.value{margin-top:5px}.bar{height:5px;background:#29304a;border-radius:5px;margin-top:6px}.bar i{display:block;height:100%;background:#6fe2c7;border-radius:5px}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
</style></head><body><main class="card"><div class="avatar"><div class="face"><i class="eye l"></i><i class="eye r"></i><i class="mouth"></i></div></div><div class="mode" id="mode">STARTING</div><div class="activity" id="activity">Connecting to local cognitive runtime…</div><div class="grid"><div class="box"><div class="label">Intention</div><div class="value" id="intent">—</div></div><div class="box"><div class="label">Goal</div><div class="value" id="goal">None</div></div><div class="box"><div class="label">Curiosity</div><div class="bar"><i id="curiosity"></i></div></div><div class="box"><div class="label">Confidence</div><div class="bar"><i id="confidence"></i></div></div></div></main><script>async function tick(){try{let s=await fetch('/api/state',{cache:'no-store'}).then(r=>r.json());mode.textContent=s.affect.mode;activity.textContent=s.activity+' · '+s.status;intent.textContent=s.intention||'quietly available';goal.textContent=s.active_goal?.text||'None';curiosity.style.width=(s.affect.curiosity*100)+'%';confidence.style.width=(s.affect.confidence*100)+'%';document.querySelector('.avatar').style.animationDuration=(5-s.affect.arousal*3)+'s';let cb=s.world?.find(x=>x.key==='cursor');if(cb){let x=(cb.value?.[0]||0)/(screen.width||1)-.5;document.querySelectorAll('.eye').forEach(e=>e.style.transform=`translateX(${Math.max(-5,Math.min(5,x*10))}px)`)}}catch(e){activity.textContent='Runtime unavailable'}setTimeout(tick,750)}tick()</script></body></html>
