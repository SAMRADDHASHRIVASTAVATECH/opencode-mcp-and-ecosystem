[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-addon-ops-core"
version = "1.0.0"
description = "Self-contained, additive extension layer (operational capabilities core) for an existing JARVIS."
readme = "docs/README.md"
requires-python = ">=3.9"
license = { text = "Proprietary / internal" }
authors = [{ name = "JARVIS Add-On project" }]
dependencies = [
  "PyYAML>=5.4",
]

[project.optional-dependencies]
validate = ["jsonschema>=4.0"]

[tool.setuptools]
packages = ["jarvis_addon"]

[tool.setuptools.package-dir]
jarvis_addon = "src/jarvis_addon"

