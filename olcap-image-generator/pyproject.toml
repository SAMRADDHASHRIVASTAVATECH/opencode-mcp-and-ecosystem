[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olcap-image-generator"
version = "1.0.0"
description = "AI-controlled local image-generation infrastructure exposed through MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.27,<2",
    "pydantic>=2.0",
    "psutil>=5.9",
    "requests>=2.31",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# Inference backend (GPU): install on the machine that actually runs generation.
inference = [
    "torch>=2.2",
    "diffusers>=0.27",
    "transformers>=4.40",
    "accelerate>=0.30",
    "safetensors>=0.4",
]
comfy = ["websocket-client>=1.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
olcap-image-generator = "olcap_image_gen.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olcap_image_gen = ["workflows/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
