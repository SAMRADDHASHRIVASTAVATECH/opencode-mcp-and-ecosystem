[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "office-documents-mcp"
version = "1.0.0"
description = "Standalone MCP server for DOCX, XLSX, and PPTX documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Office Documents MCP" }]
dependencies = [
  "mcp>=1.2.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "python-pptx>=0.6.23",
  "lxml>=4.9.0",
  "pillow>=10.0.0",
  "pandas>=2.0.0",
  "mammoth>=1.6.0",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
office-documents-mcp = "office_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
